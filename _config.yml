# Configuración del sitio
title: "Mac Master Importadores"
description: "Expertos en tornillería y soluciones industriales"
url: "https://macmaster25.github.io"
baseurl: "/MacMaster-Web"

# Configuración para incluir archivos estáticos
include:
  - Assets
  - style
  - javascript

# Configuración de Jekyll
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Configuración de colecciones
collections:
  posts:
    output: true
    permalink: /:collection/:title/

# Configuración de permalinks
permalink: /:title/

# Configuración de paginación
paginate: 10
paginate_path: "/page/:num/"

# Configuración de sitemap
sitemap:
  exclude:
    - /feed.xml
    - /sitemap.xml

# Configuración de robots.txt
robots:
  user_agent: "*"
  disallow:
    - /admin/
    - /private/

# Configuración de Google Analytics (opcional)
google_analytics: ""

# Configuración de comentarios (opcional)
comments: false

# Configuración de redes sociales
social:
  twitter: "@macmaster"
  facebook: "macmaster"
  instagram: "macmaster"

# Configuración de contacto
contact:
  email: "info@macmaster.com"
  phone: "+1 234 567 890"
  address: "Dirección de la empresa"

# Configuración de horarios
hours:
  monday: "9:00 AM - 6:00 PM"
  tuesday: "9:00 AM - 6:00 PM"
  wednesday: "9:00 AM - 6:00 PM"
  thursday: "9:00 AM - 6:00 PM"
  friday: "9:00 AM - 6:00 PM"
  saturday: "9:00 AM - 2:00 PM"
  sunday: "Cerrado"
