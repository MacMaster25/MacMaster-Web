# Site settings
title: "Mac Master Importadores"
email: "proyectos@macmaster.co"
description: "Mac Master Importadores - Proveedores de equipos comerciales e industriales"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://macmaster25.github.io" # the base hostname & protocol for your site
twitter_username: "macmasterimportadores"
github_username: "macmaster25"

# Company Information for SEO
company_name: "Mac Master Importadores"
company_phone: "+57 317 789 9482"
company_email: "proyectos@macmaster.co"
company_street: "Av. 5c Nte. #46 - 01"
company_city: "Cali"
company_state: "Valle del Cauca"
company_zip: "760001"
company_country: "Colombia"
company_hours: "Lunes a Viernes 8:00 AM - 5:00 PM"
company_payment_methods: ["Efectivo", "Transferencias", "PSE", "Tarjeta de crédito", "Tarjeta de débito"]
company_instagram: "https://www.instagram.com/macmasterimport"
company_facebook: "https://www.facebook.com/macmasterimport"
company_latitude: "3.4848443509959193"
company_longitude: "-76.52750052432418"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  product:
    output: true
    permalink: /product/:title/
  categories:
    output: true
    permalink: /categorias/:title/
  subcategory:
    output: true
    permalink: /subcategory/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
  - scope:
      path: ""
      type: "categories"
    values:
      layout: "category"
  - scope:
      path: ""
      type: "subcategories"
    values:
      layout: "subcategory"

# SEO Settings
author:
  name: "Mac Master Importadores"
  email: "proyectos@macmaster.co"

# Social media
social:
  name: "Mac Master Importadores"
  links:
    - "https://www.instagram.com/macmasterimport"
    - "https://www.facebook.com/macmasterimport"

# Google Analytics (replace with your tracking ID)
google_analytics: "GA_TRACKING_ID"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/ 