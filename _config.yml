# Site settings
title: "Your Company Name"
email: "contact@yourcompany.com"
description: "Your company description - specializing in quality products"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://macmaster25.github.io" # the base hostname & protocol for your site
twitter_username: "yourcompany"
github_username: "yourcompany"

# Company Information for SEO
company_name: "Your Company Name"
company_phone: "+1-555-123-4567"
company_email: "contact@yourcompany.com"
company_street: "123 Main Street"
company_city: "New York"
company_state: "NY"
company_zip: "10001"
company_country: "US"
company_hours: "Monday-Friday 9AM-6PM"
company_payment_methods: ["Cash", "Credit Card", "PayPal"]
company_facebook: "https://www.facebook.com/yourcompany"
company_twitter: "https://twitter.com/yourcompany"
company_linkedin: "https://www.linkedin.com/company/yourcompany"
company_instagram: "https://www.instagram.com/yourcompany"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  product:
    output: true
    permalink: /product/:title/
  categories:
    output: true
    permalink: /categorias/:title/
  subcategory:
    output: true
    permalink: /subcategory/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
  - scope:
      path: ""
      type: "categories"
    values:
      layout: "category"
  - scope:
      path: ""
      type: "subcategories"
    values:
      layout: "subcategory"

# SEO Settings
author:
  name: "Your Company Name"
  email: "contact@yourcompany.com"

# Social media
social:
  name: "Your Company Name"
  links:
    - "https://twitter.com/yourcompany"
    - "https://facebook.com/yourcompany"

# Google Analytics (replace with your tracking ID)
google_analytics: "GA_TRACKING_ID"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/ 