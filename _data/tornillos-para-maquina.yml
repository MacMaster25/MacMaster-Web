applications:
  - industry: "Electrónica"
    description: "Ensamblaje de carcasas, placas y componentes."
  - industry: "Maquinaria ligera"
    description: "Fijación de partes móviles o estructurales."
  - industry: "Electrodomésticos"
    description: "Montaje interno y externo de piezas."
  - industry: "Automatización industrial"
    description: "Unión de sensores, soportes y piezas metálicas."

characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASME B18.6.3, ANSI B18.6.3."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316), latón."
  - name: "Acabados"
    description: "Zincado, niquelado, pavonado."
  - name: "Resistencia a la tracción"
    description: "Depende del material; comúnmente entre 60,000 y 100,000 psi."
  - name: "Roscas"
    description: "UNC (rosca gruesa) y UNF (rosca fina), con opciones métricas."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde #2 hasta 1/2\" (o M2 a M12)"
  - name: "Longitudes"
    description: "De 1/4\" hasta 3\" (o 6 mm a 75 mm)"
  - name: "Tipo de cabeza"
    description: "Plana, avellanada, redonda, ovalada"
  - name: "Estilo de rosca"
    description: "Completa, paso fino o grueso"
  - name: "Tipos de ranura"
    description: "Phillips, ranurada, torx, combinada"

documentation:
