      description: "Una vez mezclada la solución, encienda la bomba de la lavadora para que la solución comience a circular."
      image: "assets/images/subcategory-lavadora-piezas/simple-green-activar-bomba.webp"
    - step: "Proceso de limpieza"
      description: "Coloque las piezas sobre la rejilla. Utilice la manguera y la boquilla para rociar la solución limpiadora directamente sobre las piezas sucias."
      image: "assets/images/subcategory-lavadora-piezas/simple-green-rociado-limpieza.webp"
    - step: "Reciclaje de la solución"
      description: "La solución sucia regresa al depósito y pasa por un sistema de filtrado. Se separan los contaminantes y permite que la solución limpia se reutilice."
      image: "assets/images/subcategory-lavadora-piezas/simple-green-filtrado-reciclaje.webp"
    - step: "Descarga y mantenimiento"
      description: "Con el tiempo, el limpiador se saturará de contaminantes. Para descargar la solución, debe seguir las instrucciones del manual para drenar el depósito de manera segura."
