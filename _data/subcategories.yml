  description: "Soluciones robustas y seguras para el lavado y desengrase profundo de piezas mecánicas. Diseñadas para usar con desengrasantes acuosos, ofrecen limpieza potente sin el riesgo de solventes."
  image: "assets/images/subcategory-lavadora-piezas/lavadora-de-piezas-simple-green.webp"
