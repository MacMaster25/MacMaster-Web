    description: "Sujeción de elementos en vagones, trailers o maquinaria pesada."

characteristics:
  - name: "Normas"
    description: "ASTM A307, ASME B18.5."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316)."
  - name: "Acabados"
    description: "Galvanizado en caliente, zincado, recubrimiento fosfatado."
  - name: "Tipos de cuello"
    description: "Cuello cuadrado (tipo carro), cuello liso."
  - name: "Roscas"
    description: "Parciales o completas; disponibles en UNC o métricas."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde 1/4\" hasta 1\" (o M6 a M24)"
  - name: "Longitudes"
    description: "De 1/2\" hasta 6\" (o 12 mm a 150 mm)"
  - name: "Tipo de cabeza"
    description: "Redonda, estilo domo"
  - name: "Cuello"
    description: "Cuadrado o liso, según aplicación"
  - name: "Grados de resistencia"
    description: "Grado 2, 5, 8, o equivalentes métricos"

