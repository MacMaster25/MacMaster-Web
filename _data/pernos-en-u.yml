applications:
  - industry: "Tuberías"
    description: "Sujeción de conductos y líneas de gas o agua."
  - industry: "Vehículos"
    description: "Montaje de ejes, suspensiones y sistemas de escape."
  - industry: "Construcción metálica"
    description: "Fijación de estructuras tubulares."
  - industry: "Instalaciones eléctricas"
    description: "Soporte de bandejas portacables o tubos EMT."

characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASTM A307 y ASME B18.31.5."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316)."
  - name: "Acabados"
    description: "Galvanizado en caliente, zincado, acero sin recubrimiento."
  - name: "Forma de la curva"
    description: "Redonda, cuadrada o semicircular."
  - name: "Roscas"
    description: "UNC, rosca métrica o rosca parcial."

specifications:
  - name: "Diámetros de tubo soportado"
    description: "Desde 1/2\" hasta 12\""
  - name: "Longitud del vástago"
    description: "De 2\" hasta 24\" (o más, según aplicación)"
  - name: "Tipo de rosca"
    description: "Parcial o completa"
  - name: "Separación entre patas"
    description: "Varía según diámetro del tubo"
  - name: "Forma del arco"
    description: "Redonda, cuadrada, semicircular"

