characteristics:
  - name: "Resistencia a la tracción"
    description: "Varía según el grado: Grado 2 (74 ksi), Grado 5 (120 ksi), Grado 8 (150 ksi)."
  - name: "Resistencia al cizallamiento"
    description: "Aproximadamente 60% de la resistencia a la tracción."
  - name: "Acabado superficial"
    description: "Zincado, fosfatado, o sin acabado según especificación."
  - name: "Tolerancia dimensional"
    description: "Cumple con estándares ASME B18.2.1."
  - name: "Roscado"
    description: "UNC, UNF, métrico según especificación."

specifications:
  - name: "Diámetros disponibles"
    description: "1/4\" a 1-1/2\" (6.35mm a 38.1mm)."
  - name: "Longitudes estándar"
    description: "1/2\" a 12\" (12.7mm a 304.8mm)."
  - name: "Materiales"
    description: "Acero al carbono, acero inoxidable 18-8, 316, A2, A4."
  - name: "Grados de resistencia"
    description: "Grado 2, 5, 8, 9, Clase 8.8, 10.9."
  - name: "Normas aplicables"
    description: "ASME B18.2.1, ASTM A307, A325, A490."

