applications:
  - industry: "Construcción"
    description: "Refuerzo en uniones atornilladas en estructuras metálicas y de madera."
  - industry: "Maquinaria"
    description: "Distribución de carga en componentes móviles o sensibles."
  - industry: "Electricidad e instalaciones"
    description: "Montaje de canaletas, bandejas y soportes."
  - industry: "Automoción"
    description: "Fijación segura en sistemas mecánicos y eléctricos."

characteristics:
  - name: "Normas"
    description: "ASME B18.22.1, DIN 125, SAE J403 (según el modelo)."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304/316), latón, nylon, cobre."
  - name: "Acabados"
    description: "Zincado, galvanizado, pavonado, sin recubrimiento."
  - name: "Espesores"
    description: "Variables según el tipo (liviano, regular, pesado)."
  - name: "Diámetros internos/externos"
    description: "Múltiples combinaciones para adaptarse a tornillos métricos e imperiales."

specifications:
  - name: "Diámetros internos"
    description: "Desde #6 hasta 1-1/2\" (o M3 a M36)"
  - name: "Espesor"
    description: "Liviano (~0.03\"), regular (~0.06\"), pesado (~0.12\")"
  - name: "Material"
    description: "Acero, inoxidable, plásticos, cobre, latón"
  - name: "Tipo de estándar"
    description: "SAE, USS, métricas"
  - name: "Aplicación"
    description: "General o de alto rendimiento"

