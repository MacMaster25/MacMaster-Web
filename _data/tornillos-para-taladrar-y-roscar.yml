applications:
  - industry: "Construcción metálica ligera"
    description: "Fijación de paneles, techos y estructuras."
  - industry: "HVAC"
    description: "Montaje de ductos y sistemas de ventilación."
  - industry: "Carpintería y estructuras de madera"
    description: "Instalación de bisagras, soportes y refuerzos."
  - industry: "Industria automotriz y electrodomésticos"
    description: "Fijación de paneles y componentes internos."

characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASTM C1513 (autoperforantes para drywall), ASME B18.6.4."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable, acero endurecido."
  - name: "Acabados"
    description: "Zincado, fosfatado, galvanizado, revestimiento cerámico."
  - name: "Resistencia a la tracción"
    description: "Varía según el tipo de material; pueden soportar aplicaciones exigentes."
  - name: "Roscas"
    description: "Autoformantes o autorroscantes, disponibles en métrico y pulgadas."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde #4 hasta 1/4\" (o M3 a M6)"
  - name: "Longitudes"
    description: "De 3/8\" hasta 3\" (o 10 mm a 75 mm)"
  - name: "Tipo de cabeza"
    description: "Plana, avellanada, hexagonal, redonda"
  - name: "Estilo de rosca"
    description: "Autoformante o autorroscante"
  - name: "Punta"
    description: "Punta de broca (autoperforante) o tipo AB (autorroscante)"

