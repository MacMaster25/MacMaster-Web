applications:
  - industry: "Construcción"
    description: "Unión de varillas roscadas en instalaciones eléctricas, sanitarias y estructurales."
  - industry: "Ensamblaje industrial"
    description: "Prolongación de pernos o componentes de maquinaria."
  - industry: "Montajes metálicos"
    description: "Estructuras modulares, techos, soportes."
  - industry: "Proyectos de mantenimiento"
    description: "Reparación o extensión de sistemas existentes."

characteristics:
  - name: "Normas"
    description: "ASME B18.2.2, ASTM A563."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316), latón."
  - name: "Acabados"
    description: "Zincado, galvanizado, acabado liso, fosfatado."
  - name: "Formas disponibles"
    description: "Hexagonales, redondas (menos comunes)."
  - name: "Opciones de rosca"
    description: "UNC, UNF, rosca métrica, derecha o izquierda."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde 1/4\" hasta 1 1/2\" (o M6 a M36)"
  - name: "Longitudes típicas"
    description: "Desde 1\" hasta 3\" (25 mm a 75 mm), dependiendo del diámetro"
  - name: "Forma"
    description: "Hexagonal (estándar)"
  - name: "Tipo de rosca"
    description: "Completa interna"
  - name: "Aplicación especial"
    description: "Algunas versiones permiten roscas izquierdas"

documentation:
