category:
  name: "Tuercas de acoplamiento"
  slug: "tuercas-de-acoplamiento"
  subtitle: "Extensión segura para varillas roscadas y pernos en instalaciones estructurales e industriales."
  description: "Las tuercas de acoplamiento están diseñadas para unir dos elementos roscados, como varillas o pernos, permitiendo prolongar su longitud sin comprometer la resistencia mecánica. Su forma alargada asegura una conexión firme y alineada, ideal para usos estructurales y de mantenimiento."
