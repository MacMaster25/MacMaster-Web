characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASME B18.15, ASTM A489 (según tipo)."
  - name: "Materiales disponibles"
    description: "Acero forjado, acero inoxidable, acero galvanizado."
  - name: "Acabados"
    description: "Galvanizado en caliente, zincado, sin recubrimiento."
  - name: "Capacidad de carga"
    description: "Varía según el tamaño y el tipo; puede superar los 5,000 lb en modelos forjados."
  - name: "Tipos de rosca"
    description: "UNC (gruesa), rosca métrica."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde 1/4\" hasta 1\" (o M6 a M24)"
  - name: "Longitudes"
    description: "De 1\" hasta 12\" (o 25 mm a 300 mm)"
  - name: "Tipo de ojo"
    description: "Abierto o cerrado (soldado o forjado)"
  - name: "Estilo de rosca"
    description: "Parcial o completa"
  - name: "Tipos"
    description: "De hombro, sin hombro, giratorios"

