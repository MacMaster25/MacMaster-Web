category:
  name: "Tuercas de seguridad"
  slug: "tuercas-de-seguridad"
  subtitle: "Fijación segura que resiste vibraciones y aflojamientos involuntarios."
  description: "Las tuercas de seguridad están diseñadas para mantener la unión firme incluso bajo condiciones de vibración, movimiento o cargas dinámicas. A diferencia de las tuercas estándar, integran elementos que aumentan la fricción o el bloqueo, previniendo que se aflojen con el uso."
