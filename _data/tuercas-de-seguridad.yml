applications:
  - industry: "Maquinaria pesada"
    description: "Donde hay exposición constante a vibraciones."
  - industry: "Industria automotriz"
    description: "Sujeción de componentes críticos como suspensión y chasis."
  - industry: "Aeronáutica"
    description: "Fijaciones sujetas a cargas dinámicas y movimiento constante."
  - industry: "Equipos eléctricos e industriales"
    description: "Uniones que requieren alta seguridad."

characteristics:
  - name: "Normas"
    description: "SAE J995, ASTM A194, ASME B18.16.6."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316), aleaciones especiales."
  - name: "Acabados"
    description: "Zincado, galvanizado, pavonado, recubrimientos con fosfato."
  - name: "Tipos disponibles"
    description: "Con inserto de nylon (nyloc), de par deformado, con reborde (flange), ciegas, entre otras."
  - name: "Mecanismo de bloqueo"
    description: "Fricción mecánica, inserto no metálico, diseño autoajustable."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde #6 hasta 1 1/2\" (o M4 a M36)"
  - name: "Altura (espesor)"
    description: "Variable según tipo (baja, estándar, alta)"
  - name: "Formas"
    description: "Hexagonal, con brida, redonda (en algunos modelos)"
  - name: "Tipos"
    description: "Nylon, deformadas, de par, con reborde, ciegas"
  - name: "Grados de resistencia"
    description: "Grado 5, 8; clases métricas 8, 10, 12"

documentation:
  - title: "ASME B18.16.6 Prevailing Torque Nuts"
    link: "https://www.grainger.com/category/fasteners/nuts/lock-nuts" 