applications:
  - industry: "Maquinaria industrial"
    description: "Fijación de componentes con acceso limitado."
  - industry: "Equipos electrónicos y robótica"
    description: "Montaje compacto y preciso."
  - industry: "Aeroespacial y automotriz"
    description: "Áreas donde se requiere alta resistencia mecánica."
  - industry: "Herramientas y moldes"
    description: "Ensamblajes que requieren repetidas manipulaciones sin pérdida de sujeción."

characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASTM A574, ASME B18.3."
  - name: "Materiales disponibles"
    description: "Acero aleado, acero inoxidable (304, 316), titanio, aleaciones especiales."
  - name: "Acabados"
    description: "Óxido negro, zincado, galvanizado, pasivado."
  - name: "Resistencia a la tracción"
    description: "Hasta 180,000 psi para aleación de acero grado 12.9."
  - name: "Roscas"
    description: "Disponibles en métrico y UNC/UNF, rosca completa o parcial."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde 1/8\" hasta 1 1/2\" (o M3 a M36)."
  - name: "Longitudes"
    description: "De 1/4\" hasta 6\" (o 6 mm a 150 mm)."
  - name: "Tipo de cabeza"
    description: "Cilíndrica con hexágono interno."
  - name: "Estilo de rosca"
    description: "Completa o parcial."
  - name: "Grados de resistencia"
    description: "12.9 (métrico), Clase 10.9, SAE J429."

