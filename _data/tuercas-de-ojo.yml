  - industry: "Construcción"
    description: "Puntos de anclaje temporales o permanentes."
  - industry: "Transporte marítimo e industrial"
    description: "Sujeción de cargas pesadas."
  - industry: "Industria manufacturera"
    description: "Aplicaciones de montaje y manipulación de equipos."

characteristics:
  - name: "Normas"
    description: "Cumplen con estándares como ASME B18.15 (en algunos modelos)."
  - name: "Materiales disponibles"
    description: "Acero al carbono forjado, acero inoxidable."
  - name: "Acabados"
    description: "Galvanizado, galvanizado en caliente, sin recubrimiento."
  - name: "Capacidad de carga"
    description: "Depende del tamaño y material; algunos modelos están clasificados para uso en izaje."
  - name: "Tipo de rosca"
    description: "UNC, métrica."

specifications:
  - name: "Diámetros de rosca"
    description: "Desde 1/4\" hasta 1\" (o M6 a M24)"
  - name: "Estilo del ojo"
    description: "Ojo cerrado redondo (tipo estándar)"
  - name: "Aplicación de izaje"
    description: "Algunos modelos certificados"
  - name: "Material"
    description: "Acero forjado / inoxidable"
  - name: "Rosca"
    description: "Interna UNC o Métrica"

