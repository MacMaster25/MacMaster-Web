applications:
  - industry: "Construcción"
    description: "Fijación de estructuras metálicas, anclajes y techos."
  - industry: "Maquinaria industrial"
    description: "Ensamble de equipos y sistemas mecánicos."
  - industry: "Automotriz"
    description: "Sujeción de piezas estructurales y componentes del motor."
  - industry: "Mantenimiento general"
    description: "Aplicaciones de fijación en instalaciones eléctricas y mecánicas."

characteristics:
  - name: "Normas"
    description: "ASME B18.2.2, ASTM A563, SAE J995."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316), latón."
  - name: "Acabados"
    description: "Zincado, galvanizado en caliente, pavonado, recubrimientos anticorrosivos."
  - name: "Tipos disponibles"
    description: "Estándar, pesadas (heavy hex), con inserto de nylon (nyloc), de seguridad, entre otras."
  - name: "Roscas"
    description: "UNC, UNF y métricas; disponibles en diferentes grados de precisión."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde #6 hasta 1 1/2\" (o M4 a M36)"
  - name: "Altura (espesor)"
    description: "Varía según tipo: estándar o pesada"
  - name: "Forma de la cabeza"
    description: "Hexagonal (6 lados)"
  - name: "Tipos"
    description: "Estándar, de seguridad, con inserto, pesadas"
  - name: "Grados de resistencia"
    description: "Grado 2, 5, 8; clases métricas 8, 10, 12"

