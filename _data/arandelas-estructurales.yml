  slug: "arandelas-estructurales"
  subtitle: "Soporte reforzado para uniones de alta resistencia."
  description: "Las arandelas estructurales están diseñadas para aplicaciones de carga pesada donde se requieren uniones seguras y estables. Su uso es común en proyectos estructurales como puentes, edificios y maquinaria pesada, donde contribuyen a distribuir cargas de manera uniforme y evitar deformaciones."
