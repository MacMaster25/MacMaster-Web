applications:
  - industry: "Construcción de acero estructural"
    description: "Conexiones en vigas, columnas y marcos."
  - industry: "Infraestructura pesada"
    description: "Ensamblaje de puentes y estructuras metálicas."
  - industry: "Maquinaria industrial"
    description: "Montaje de equipos de gran tonelaje."
  - industry: "Torres de energía y telecomunicaciones"
    description: "Uniones críticas bajo cargas dinámicas."

characteristics:
  - name: "Normas"
    description: "Cumplen especificaciones ASTM F436 y A325 (según el modelo)."
  - name: "Materiales disponibles"
    description: "Acero al carbono tratado térmicamente."
  - name: "Acabados"
    description: "Galvanizado en caliente, zincado, acabado en negro."
  - name: "Dureza"
    description: "Elevada para resistir la presión y evitar deformaciones."
  - name: "Compatibilidad"
    description: "Diseñadas para trabajar con pernos estructurales de alta resistencia (A325, A490, etc.)."

specifications:
  - name: "Diámetros internos"
    description: "Desde 1/2\" hasta 1-1/2\""
  - name: "Espesor"
    description: "Mayor que arandelas estándar (uso estructural)"
  - name: "Tipo de cabeza compatible"
    description: "Pernos estructurales de cabeza pesada"
  - name: "Material"
    description: "Acero endurecido"
  - name: "Normas"
    description: "ASTM F436, A325, A563"

