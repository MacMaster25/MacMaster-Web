    description: "Conexiones y refuerzos internos."

characteristics:
  - name: "Normas"
    description: "ASTM A307, A193, B7, entre otras (según material y grado)."
  - name: "Materiales disponibles"
    description: "Acero al carbono, acero inoxidable (304, 316), latón, aleaciones especiales."
  - name: "Acabados"
    description: "Zincado, galvanizado en caliente, negro óxido, sin recubrimiento."
  - name: "Longitudes comunes"
    description: "1 m, 2 m, 3 m; también disponibles en cortes personalizados."
  - name: "Roscas"
    description: "Métrica o UNC/UNF, paso estándar o fino."

specifications:
  - name: "Diámetros disponibles"
    description: "Desde 1/4\" hasta 1-1/2\" (o M6 a M36)"
  - name: "Longitud"
    description: "De 1 pie a 12 pies (o 300 mm a 3,000 mm)"
  - name: "Tipo de rosca"
    description: "Completa, métrica o estándar (UNC/UNF)"
  - name: "Grados de resistencia"
    description: "ASTM A307, A193 B7, A320, etc."
  - name: "Material"
    description: "Acero al carbono, acero inoxidable, latón"

